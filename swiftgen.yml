input_dir: Radiofy/Resources/
output_dir: Radiofy/Resources/SwiftGen/

strings:
  inputs: Translations/en.lproj
  outputs:
    - templateName: structured-swift5
      output: Localizable.swift

xcassets:
  inputs: Assets.xcassets
  outputs:
    - templateName: swift5
      output: Assets.swift

colors:
  inputs: colors.txt
  outputs:
    templateName: swift5
    output: Colors.swift
